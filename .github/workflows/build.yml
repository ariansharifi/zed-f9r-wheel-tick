name: Build Windows EXE

on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - run: pip install pyinstaller -r requirment.txt
      - run: pyinstaller --onefile wheel-tick.py
      - uses: actions/upload-artifact@v3
        with:
          name: windows-exe
          path: dist/*.exe
